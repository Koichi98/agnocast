repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.6
    hooks:
      - id: clang-format
        types_or: [c++, c]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        language_version: 20.11.0
        args: [-c, .markdownlint.yaml, --fix]
  
  - repo: local
    hooks:
      - id: kunit
        name: Run KUnit tests
        entry: scripts/test/run_kunit.bash
        language: system
        types: [c]

      - id: clang-tidy
        name: Run clang-tidy (matches CI clang-tidy-14)
        entry: scripts/test/run_clang_tidy_precommit.bash
        language: system
        types_or: [c++]
        files: ^src/(agnocastlib|agnocast_components)/.*\.(cpp|hpp)$
        exclude: /test/
        require_serial: true
        pass_filenames: true
